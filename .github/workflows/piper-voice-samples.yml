name: Generate Piper TTS MP3 samples

on:
  push:
    branches: [main]
    paths:
      - notebooks/05_piper_tts_bilingual_offline.ipynb
      - .github/workflows/piper-voice-samples.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Piper and check FFmpeg
        run: |
          python -m pip install piper-tts
          piper --help >/dev/null
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Render four MP3s from notebook sample texts
        run: |
          python - <<'PY'
          import hashlib, json, re, shutil, subprocess, tempfile, urllib.request
          from pathlib import Path

          notebook = json.loads(Path('notebooks/05_piper_tts_bilingual_offline.ipynb').read_text(encoding='utf-8'))
          code = next(''.join(c['source']) for c in notebook['cells']
                      if c['cell_type'] == 'code' and 'let listening_texts:' in ''.join(c['source']))
          regex = r'\(\s*"(es_ES-carlfm-x_low|en_US-amy-low)"\s*,\s*"([^"\\]+)"\s*,\s*"(es|en)"\s*,\s*"([^"\\]+)"\s*,?\s*\)'
          samples = re.findall(regex, code)
          assert len(samples) == 4 and {s[1] for s in samples} == {'es_corto', 'es_largo', 'en_short', 'en_long'}, 'Notebook changed: sample list not found'
          paths = {
              'es_ES-carlfm-x_low': ('es/es_ES/carlfm/x_low', 28130791, 4159),
              'en_US-amy-low': ('en/en_US/amy/low', 63104526, 4164),
          }
          dest = Path('piper_tts_samples')
          dest.mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory(prefix='piper_') as folder:
              cache = Path(folder)
              for voice, (remote, expected_onnx, expected_json) in paths.items():
                  for name, expected in [(voice+'.onnx',expected_onnx),(voice+'.onnx.json',expected_json)]:
                      url = f'https://huggingface.co/rhasspy/piper-voices/resolve/main/{remote}/{name}'
                      with urllib.request.urlopen(url, timeout=120) as resp, (cache/name).open('wb') as f:
                          shutil.copyfileobj(resp, f)
                      assert (cache/name).stat().st_size == expected, f'Download size mismatch: {name}'
              metadata=[]
              for voice, name, lang, text in samples:
                  wav = cache/(name+'.wav')
                  mp3 = dest/(name+'.mp3')
                  subprocess.run(['piper','--model',str(cache/(voice+'.onnx')),'--output_file',str(wav)],
                                 input=text, text=True, encoding='utf-8', check=True, capture_output=True, timeout=180)
                  assert wav.is_file() and wav.stat().st_size > 1000
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav),
                                  '-ac','1','-c:a','libmp3lame','-b:a','96k',str(mp3)],check=True,timeout=60)
                  assert mp3.is_file() and mp3.stat().st_size > 1000
                  duration = float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration',
                      '-of','default=noprint_wrappers=1:nokey=1',str(mp3)], text=True).strip())
                  assert 0 < duration < 180
                  metadata.append({'file':mp3.name, 'voice':voice, 'lang':lang, 'text':text,
                                   'seconds':round(duration,3), 'bytes':mp3.stat().st_size,
                                   'sha256':hashlib.sha256(mp3.read_bytes()).hexdigest()})
                  print(f'Created real Piper sample: {mp3} ({duration:.2f} sec)')
              (dest/'metadata.json').write_text(json.dumps(metadata, ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              md = ['# Samples generated with Piper TTS','',
                    'Four real Piper TTS audio outputs using the sample texts from the Rust notebook.','',
                    '| Voice | Audio | Duration |','|---|---|---:|']
              md += [f"| {m['voice']} | [{m['file']}]({m['file']}) | {m['seconds']:.2f} s |" for m in metadata]
              (dest/'README.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: piper-bilingual-mp3-samples
          path: piper_tts_samples/
      - name: Publish MP3s to main for easy listening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add piper_tts_samples/*.mp3 piper_tts_samples/metadata.json piper_tts_samples/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'samples: publish genuine Piper ES/EN MP3 output [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
