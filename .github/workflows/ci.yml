name: Rust notebook checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate notebook JSON and Rust kernel metadata
        run: python scripts/validate_notebooks.py
      - name: Compile and run every Rust notebook
        run: python scripts/test_notebook_rust.py
      - name: Validate Bash setup and start scripts
        run: bash -n scripts/setup.sh start.sh
